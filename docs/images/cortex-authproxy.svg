<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 560" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="Cortex AuthProxy sidecar flow: an incoming request enters a workload pod where an Envoy plus ext-proc sidecar validates inbound JWTs and exchanges outbound tokens, talking to the Application and Keycloak, then forwards to the target service.">
  <title>Cortex AuthProxy Sidecar</title>
  <desc>An incoming request enters the workload pod. The AuthProxy sidecar (Envoy + Ext Proc) validates inbound JWTs via JWKS (401 if invalid) and exchanges outbound tokens for the target audience via Keycloak (RFC 8693). It fans out to the Application and Keycloak, then the request proceeds to the target service (aud: auth-target).</desc>

  <!-- Palette (shades of red)
       pod border   #7f1d1d   sidecar fill #991b1b  sidecar text #ffffff
       inner fill   #fee2e2   inner border #ef4444
       target fill  #fca5a5   target border #b91c1c
       arrows       #b91c1c   accent text  #7f1d1d -->

  <defs>
    <marker id="redArrow" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#b91c1c"/>
    </marker>
  </defs>

  <!-- Incoming request -->
  <text x="360" y="30" text-anchor="middle" fill="#7f1d1d" font-size="15" font-weight="bold">Incoming request</text>
  <line x1="360" y1="40" x2="360" y2="72" stroke="#b91c1c" stroke-width="2" marker-end="url(#redArrow)"/>

  <!-- Workload pod -->
  <rect x="24" y="80" width="672" height="352" rx="14" fill="#fff5f5" stroke="#7f1d1d" stroke-width="2.5"/>
  <text x="360" y="106" text-anchor="middle" fill="#7f1d1d" font-size="15" font-weight="bold" letter-spacing="1">WORKLOAD POD</text>

  <!-- AuthProxy sidecar -->
  <rect x="52" y="122" width="616" height="150" rx="10" fill="#991b1b"/>
  <text x="360" y="148" text-anchor="middle" fill="#ffffff" font-size="15" font-weight="bold">AuthProxy Sidecar (Envoy + Ext Proc)</text>
  <text x="76" y="182" fill="#ffe4e6" font-size="13"><tspan font-weight="bold">INBOUND:</tspan>  Validate JWT (signature, issuer, audience via JWKS).</text>
  <text x="76" y="202" fill="#ffe4e6" font-size="13">Return 401 if invalid.</text>
  <text x="76" y="230" fill="#ffe4e6" font-size="13"><tspan font-weight="bold">OUTBOUND:</tspan>  Exchange token for target audience via Keycloak</text>
  <text x="76" y="250" fill="#ffe4e6" font-size="13">(RFC 8693). HTTPS traffic passes through as-is.</text>

  <!-- Arrows down to app / keycloak -->
  <g stroke="#b91c1c" stroke-width="2" marker-end="url(#redArrow)" fill="none">
    <path d="M240,272 L240,300 L200,300 L200,326"/>
    <path d="M480,272 L480,300 L520,300 L520,326"/>
  </g>

  <!-- Application + Keycloak -->
  <g fill="#fee2e2" stroke="#ef4444" stroke-width="1.5">
    <rect x="112" y="334" width="176" height="60" rx="8"/>
    <rect x="432" y="334" width="176" height="60" rx="8"/>
  </g>
  <g fill="#7f1d1d" font-size="15" font-weight="bold" text-anchor="middle">
    <text x="200" y="370">Application</text>
    <text x="520" y="370">Keycloak</text>
  </g>

  <!-- Down to target service -->
  <line x1="360" y1="432" x2="360" y2="466" stroke="#b91c1c" stroke-width="2" marker-end="url(#redArrow)"/>

  <!-- Target service -->
  <rect x="248" y="474" width="224" height="70" rx="10" fill="#fca5a5" stroke="#b91c1c" stroke-width="2"/>
  <text x="360" y="503" text-anchor="middle" fill="#7f1d1d" font-size="15" font-weight="bold">TARGET SERVICE</text>
  <text x="360" y="524" text-anchor="middle" fill="#7f1d1d" font-size="12">(aud: auth-target)</text>
</svg>
