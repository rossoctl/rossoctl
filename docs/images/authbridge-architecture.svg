<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 660" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="AuthBridge architecture flow: the operator registers a client with Keycloak, RossoCortex gets a token and sends a request with it to the target, Envoy plus ext-proc validates and exchanges the token via Keycloak, then the target validates the audience.">
  <title>AuthBridge Architecture Flow</title>
  <desc>1. Operator reconciles AgentRuntime CRs and labels target workloads. 2. Operator registers client with Keycloak. 3. RossoCortex gets a token from Keycloak (aud: agent's ID). 4. RossoCortex sends a request to the target with the token. 5. Envoy+ext-proc validates the token (signature, expiration, issuer via JWKS) and exchanges it for the target audience via Keycloak. 6. Target receives the request with the exchanged token and validates the audience.</desc>

  <!-- Palette (shades of red)
       lane border    #7f1d1d   lane header/footer fill #fee2e2  lane border #ef4444
       note fill      #fee2e2   note border  #ef4444    note text #7f1d1d
       target fill    #fca5a5   target border #b91c1c
       arrows         #b91c1c   accent text  #7f1d1d -->

  <defs>
    <marker id="redArrow2" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#b91c1c"/>
    </marker>
  </defs>

  <!-- Lifelines -->
  <g stroke="#fca5a5" stroke-width="2">
    <line x1="110" y1="60" x2="110" y2="590"/>
    <line x1="330" y1="60" x2="330" y2="590"/>
    <line x1="530" y1="60" x2="530" y2="590"/>
    <line x1="690" y1="60" x2="690" y2="590"/>
  </g>

  <!-- Header boxes -->
  <g fill="#fee2e2" stroke="#ef4444" stroke-width="1.5">
    <rect x="35" y="14" width="150" height="46" rx="8"/>
    <rect x="220" y="14" width="220" height="46" rx="8"/>
    <rect x="455" y="14" width="150" height="46" rx="8"/>
    <rect x="615" y="14" width="150" height="46" rx="8"/>
  </g>
  <g fill="#7f1d1d" font-size="14" font-weight="bold" text-anchor="middle">
    <text x="110" y="41">Operator</text>
    <text x="330" y="41">RossoCortex (Agent + Envoy)</text>
    <text x="530" y="41">Keycloak</text>
    <text x="690" y="41">Target</text>
  </g>

  <!-- Step 1: note over Operator -->
  <g fill="#fee2e2" stroke="#ef4444" stroke-width="1.5">
    <rect x="20" y="76" width="200" height="46" rx="8"/>
  </g>
  <g fill="#7f1d1d" font-size="12">
    <text x="30" y="94">1. Reconciles AgentRuntime CRs,</text>
    <text x="30" y="110">labels target workloads</text>
  </g>

  <!-- Step 2: Operator -> Keycloak -->
  <line x1="110" y1="160" x2="522" y2="160" stroke="#b91c1c" stroke-width="2" marker-end="url(#redArrow2)"/>
  <text x="320" y="150" text-anchor="middle" fill="#7f1d1d" font-size="13">2. Register client</text>

  <!-- Step 3: RossoCortex -> Keycloak (get token) + return -->
  <line x1="330" y1="210" x2="522" y2="210" stroke="#b91c1c" stroke-width="2" marker-end="url(#redArrow2)"/>
  <text x="430" y="200" text-anchor="middle" fill="#7f1d1d" font-size="13">3. Get token</text>

  <line x1="530" y1="242" x2="338" y2="242" stroke="#b91c1c" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#redArrow2)"/>
  <text x="430" y="234" text-anchor="middle" fill="#7f1d1d" font-size="12">Token (aud: agent's ID)</text>

  <!-- Step 4: RossoCortex -> Target -->
  <line x1="330" y1="292" x2="682" y2="292" stroke="#b91c1c" stroke-width="2" marker-end="url(#redArrow2)"/>
  <text x="510" y="282" text-anchor="middle" fill="#7f1d1d" font-size="13">4. Request + token</text>

  <!-- Step 5: note over RossoCortex -->
  <g fill="#fee2e2" stroke="#ef4444" stroke-width="1.5">
    <rect x="180" y="320" width="300" height="66" rx="8"/>
  </g>
  <g fill="#7f1d1d" font-size="12" text-anchor="middle">
    <text x="330" y="340">5. Envoy+ext-proc validates token</text>
    <text x="330" y="356">(signature, expiration, issuer via JWKS)</text>
    <text x="330" y="372">then exchanges for target audience</text>
  </g>

  <line x1="330" y1="414" x2="522" y2="414" stroke="#b91c1c" stroke-width="2" marker-end="url(#redArrow2)"/>
  <text x="430" y="404" text-anchor="middle" fill="#7f1d1d" font-size="13">Exchange token</text>

  <line x1="530" y1="446" x2="338" y2="446" stroke="#b91c1c" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#redArrow2)"/>
  <text x="430" y="438" text-anchor="middle" fill="#7f1d1d" font-size="12">Token (aud: target)</text>

  <!-- Forward to target with exchanged token -->
  <line x1="330" y1="486" x2="682" y2="486" stroke="#b91c1c" stroke-width="2" marker-end="url(#redArrow2)"/>
  <text x="510" y="476" text-anchor="middle" fill="#7f1d1d" font-size="13">Forward with exchanged token</text>

  <!-- Step 6: Target validates audience -->
  <rect x="600" y="512" width="180" height="60" rx="8" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="690" y="536" text-anchor="middle" fill="#7f1d1d" font-size="13">6. Validate audience</text>
  <text x="690" y="554" text-anchor="middle" fill="#7f1d1d" font-size="12">&#8220;authorized&#8221;</text>

  <!-- Footer boxes -->
  <g fill="#fee2e2" stroke="#ef4444" stroke-width="1.5">
    <rect x="35" y="590" width="150" height="46" rx="8"/>
    <rect x="220" y="590" width="220" height="46" rx="8"/>
    <rect x="455" y="590" width="150" height="46" rx="8"/>
    <rect x="615" y="590" width="150" height="46" rx="8"/>
  </g>
  <g fill="#7f1d1d" font-size="14" font-weight="bold" text-anchor="middle">
    <text x="110" y="617">Operator</text>
    <text x="330" y="617">RossoCortex (Agent + Envoy)</text>
    <text x="530" y="617">Keycloak</text>
    <text x="690" y="617">Target</text>
  </g>
</svg>
