<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 640" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="Rossoctl architecture diagram: components and their deployment namespaces within a Kubernetes cluster">
  <title>Rossoctl Architecture</title>
  <desc>All the Rossoctl components and their deployment namespaces within a Kubernetes cluster.</desc>

  <!-- Palette (shades of red)
       cluster border  #7f1d1d   header fill  #991b1b
       namespace fill   #fef2f2   namespace border #fca5a5
       component fill   #fee2e2   component border #ef4444
       accent text      #7f1d1d -->

  <!-- Cluster outer container -->
  <rect x="10" y="10" width="840" height="620" rx="14" fill="#fff5f5" stroke="#7f1d1d" stroke-width="2.5"/>

  <!-- Cluster header -->
  <rect x="10" y="10" width="840" height="46" rx="14" fill="#991b1b"/>
  <rect x="10" y="34" width="840" height="22" fill="#991b1b"/>
  <text x="430" y="40" text-anchor="middle" fill="#ffffff" font-size="20" font-weight="bold">Kubernetes Cluster</text>

  <!-- rossoctl-system Namespace -->
  <rect x="34" y="76" width="792" height="118" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="52" y="100" fill="#7f1d1d" font-size="15" font-weight="bold">rossoctl-system Namespace</text>
  <g fill="#fee2e2" stroke="#ef4444" stroke-width="1.5">
    <rect x="52" y="116" width="170" height="62" rx="7"/>
    <rect x="242" y="116" width="170" height="62" rx="7"/>
    <rect x="432" y="116" width="170" height="62" rx="7"/>
    <rect x="622" y="116" width="186" height="62" rx="7"/>
  </g>
  <g fill="#7f1d1d" font-size="14" text-anchor="middle">
    <text x="137" y="152" font-weight="bold">Rossoctl UI</text>
    <text x="327" y="145" font-weight="bold">Shipwright</text>
    <text x="327" y="163" font-size="12">(Builds)</text>
    <text x="517" y="145" font-weight="bold">Ingress</text>
    <text x="517" y="163" font-size="12">Gateway</text>
    <text x="715" y="152" font-weight="bold">Kiali</text>
  </g>

  <!-- Workload Namespaces -->
  <rect x="34" y="210" width="792" height="118" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5"/>
  <text x="52" y="234" fill="#7f1d1d" font-size="15" font-weight="bold">Workload Namespaces (team1, team2, ...)</text>
  <g fill="#fee2e2" stroke="#ef4444" stroke-width="1.5">
    <rect x="86" y="250" width="196" height="62" rx="7"/>
    <rect x="332" y="250" width="196" height="62" rx="7"/>
    <rect x="578" y="250" width="196" height="62" rx="7"/>
  </g>
  <g fill="#7f1d1d" font-size="14" text-anchor="middle">
    <text x="184" y="273" font-weight="bold">A2A Agents</text>
    <text x="184" y="290" font-size="11">LangGraph, CrewAI,</text>
    <text x="184" y="304" font-size="11">AG2...</text>
    <text x="430" y="273" font-weight="bold">MCP Tools</text>
    <text x="430" y="290" font-size="11">weather, slack,</text>
    <text x="430" y="304" font-size="11">fetch...</text>
    <text x="676" y="277" font-weight="bold">Custom</text>
    <text x="676" y="294" font-weight="bold">Workloads</text>
  </g>

  <!-- gateway-system + mcp-system -->
  <g fill="#fef2f2" stroke="#fca5a5" stroke-width="1.5">
    <rect x="150" y="344" width="270" height="96" rx="10"/>
    <rect x="440" y="344" width="270" height="96" rx="10"/>
  </g>
  <text x="285" y="368" text-anchor="middle" fill="#7f1d1d" font-size="14" font-weight="bold">gateway-system</text>
  <text x="575" y="368" text-anchor="middle" fill="#7f1d1d" font-size="14" font-weight="bold">mcp-system</text>
  <g fill="#fee2e2" stroke="#ef4444" stroke-width="1.5">
    <rect x="172" y="380" width="226" height="46" rx="7"/>
    <rect x="462" y="380" width="226" height="46" rx="7"/>
  </g>
  <g fill="#7f1d1d" font-size="13" text-anchor="middle">
    <text x="285" y="400" font-weight="bold">MCP Gateway</text>
    <text x="285" y="416" font-size="11">(Envoy)</text>
    <text x="575" y="400" font-weight="bold">MCP Broker</text>
    <text x="575" y="416" font-size="11">Controller</text>
  </g>

  <!-- Platform / infrastructure row -->
  <g fill="#fee2e2" stroke="#ef4444" stroke-width="1.5">
    <rect x="52" y="470" width="230" height="70" rx="7"/>
    <rect x="315" y="470" width="230" height="70" rx="7"/>
    <rect x="578" y="470" width="230" height="70" rx="7"/>
  </g>
  <g fill="#7f1d1d" font-size="14" text-anchor="middle">
    <text x="167" y="500" font-weight="bold">SPIRE</text>
    <text x="167" y="518" font-size="11">(Identity)</text>
    <text x="430" y="500" font-weight="bold">IAM</text>
    <text x="430" y="518" font-size="11">(e.g. Keycloak)</text>
    <text x="693" y="500" font-weight="bold">Istio Ambient</text>
    <text x="693" y="518" font-size="11">(Service Mesh)</text>
  </g>

  <!-- Caption band -->
  <text x="430" y="600" text-anchor="middle" fill="#991b1b" font-size="12" font-style="italic">Rossoctl components and their deployment namespaces</text>
</svg>
